name: Python Unit Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Execute Test Suite
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository workspace code
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # 2. Establish uniform Python Environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Automatically caches installed packages for faster build runs

      # 3. Install core framework requirements
      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      # 4. Run automated mock verification suite
      - name: Run Test Engine via Pytest
        env:
          # Prevents matplotlib from attempting to open physical window displays inside the Linux runner
          MPLBACKEND: Agg
        run: |
          pytest --cov=src tests/ --cov-report=term-missing
